[package]
name = "term-wm-vt100"
version = "0.16.2-patch5"
authors = [
    "Jesse Luehrs <doy@tozt.net>",
    "Jeremy Harris <jeremy.harris@zenosmosis.com",
]
edition = "2021"
rust-version = "1.70"

description = "Fork of vt100 specifically for usage in term-wm"
repository = "https://github.com/jzombie/term-wm-vt100"
readme = "README.md"
keywords = ["terminal", "vt100"]
categories = ["command-line-interface", "encoding"]
license = "MIT"
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
itoa = "1.0.15"
unicode-width = "0.2.1"
vte = "0.15.0"

[dev-dependencies]
crossterm = "0.29"
quickcheck = "1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
terminal_size = "0.4.2"
