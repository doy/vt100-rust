[package]
name = "vt100"
version = "0.16.2"
authors = ["Jesse Luehrs <doy@tozt.net>"]
edition = "2021"
rust-version = "1.70"

description = "Library for parsing terminal data"
homepage = "https://github.com/doy/vt100-rust"
repository = "https://github.com/doy/vt100-rust"
readme = "README.md"
keywords = ["terminal", "vt100"]
categories = ["command-line-interface", "encoding"]
license = "MIT"
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
itoa = "1.0.18"
unicode-width = "0.2.2"
vte = { version = "0.15.0", default-features = false }
embedded-io = { version = "0.7.1", optional = true }

[dev-dependencies]
nix = { version = "0.31.3", features = ["term"] }
quickcheck = "1.0"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
terminal_size = "0.4.3"

[features]
default = ["std"]
std = ["vte/std"]
